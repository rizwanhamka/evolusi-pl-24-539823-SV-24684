name: Laravel CI/CD

on:
  push:
    branches:
      - main
      - dev
      - "feature/**"

  pull_request:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Laravel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Verify Laravel application
        run: php artisan --version

  test:
    name: Test Laravel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare testing environment
        run: |
          cp .env.example .env
          touch database/database.sqlite
          php artisan key:generate

      - name: Run Laravel tests
        run: php artisan test

  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Simulate staging deployment
        run: |
          echo "Starting staging deployment..."
          echo "Checking application..."
          echo "Preparing staging environment..."
          echo "Staging deployment completed."

  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging

    if: github.ref == 'refs/heads/main'

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate production deployment
        run: |
          echo "Step 1: Pull latest source code"
          echo "Step 2: Install production dependencies"
          echo "Step 3: Enable maintenance mode"
          echo "Step 4: Run database migrations"
          echo "Step 5: Clear and rebuild application cache"
          echo "Step 6: Restart application services"
          echo "Step 7: Disable maintenance mode"
          echo "Production deployment simulation completed."
